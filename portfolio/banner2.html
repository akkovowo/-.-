.phone{position:absolute;width:262px;height:572px;border-radius:56px;padding:7px;background:linear-gradient(145deg,#d9dbe2,#8f929c 30%,#c9ccd4 55%,#7d808a);box-shadow:0 44px 80px rgba(30,40,80,.42),0 0 0 1px rgba(0,0,0,.35),inset 0 0 0 1.5px rgba(255,255,255,.55)}

.phone .sb .r{display:flex;gap:6px;align-items:center}
.phone .di{position:absolute;left:50%;top:11px;width:80px;height:24px;margin-left:-40px;border-radius:99px;background:#000;z-index:4}
.phone .gl{position:absolute;inset:0;z-index:5;border-radius:45px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.22),rgba(255,255,255,0) 32%)}
.phone .hb{position:absolute;left:50%;bottom:7px;width:92px;height:4px;margin-left:-46px;border-radius:9px;background:rgba(0,0,0,.55);z-index:5}
.btn{position:absolute;width:4px;border-radius:3px;background:linear-gradient(90deg,#8c8f99,#cfd2da)}
.tags{position:absolute;left:76px;bottom:70px;display:flex;gap:14px}
.tag{padding:15px 28px;border-radius:99px;font-size:26px;font-weight:700}
.who{position:absolute;right:76px;bottom:50px;text-align:right}

.note{position:absolute;left:76px;bottom:28px;font-size:17px;color:#8a8e99}
