<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f6f7fa;color:#1b1c22;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.g{position:absolute;border-radius:50%}
.g1{width:900px;height:900px;left:-300px;top:-260px;background:radial-gradient(circle,rgba(246,71,71,.34),rgba(246,71,71,0) 66%)}
.g2{width:1000px;height:1000px;right:-420px;top:380px;background:radial-gradient(circle,rgba(255,154,77,.34),rgba(255,154,77,0) 66%)}
.g3{width:800px;height:800px;left:-200px;bottom:-380px;background:radial-gradient(circle,rgba(110,140,255,.26),rgba(110,140,255,0) 66%)}
.glass{background:rgba(255,255,255,.62);border:1.5px solid rgba(255,255,255,.95);box-shadow:inset 2px 2px 0 #fff,0 30px 70px rgba(40,50,90,.18),0 0 0 1px rgba(40,50,80,.05)}
.top{position:absolute;left:70px;right:70px;top:64px;display:flex;justify-content:space-between;align-items:center}
.pill{padding:12px 24px;border-radius:99px;font-size:23px;font-weight:600;color:#4a4e59}
.pill b{color:#f64747}
h1{position:absolute;left:70px;top:150px;font-size:94px;line-height:1;letter-spacing:-.045em;font-weight:800}
h1 span{color:#f64747}
.desk{position:absolute;left:70px;top:500px;width:760px;height:470px;border-radius:34px;overflow:hidden;padding:12px}
.desk img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:24px;display:block}
.cart{position:absolute;right:44px;top:520px;width:390px;height:270px;border-radius:34px;overflow:hidden;padding:10px;transform:rotate(3deg)}
.cart img{width:100%;height:100%;object-fit:cover;object-position:center 42%;border-radius:25px;display:block}
.phone{position:absolute;right:74px;top:690px;width:270px;height:540px;border-radius:52px;background:#14151b;padding:11px;box-shadow:0 40px 80px rgba(30,40,80,.4),inset 0 0 0 2px #2b2d36}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:42px;display:block}
.chips{position:absolute;left:70px;top:1010px;display:flex;gap:12px;width:700px}
.chip{padding:13px 22px;border-radius:99px;font-size:22px;font-weight:700;white-space:nowrap}
.chip i{font-style:normal;color:#f64747}
.foot{position:absolute;left:70px;right:70px;bottom:50px;display:flex;justify-content:space-between;align-items:center;font-size:25px;color:#4a4e59;font-weight:600}
.foot .tech{display:flex;gap:10px}
.foot .tech span{padding:10px 20px;border-radius:99px;background:#1b1c22;color:#fff;font-size:22px;font-weight:700}
.note{position:absolute;left:70px;top:1100px;width:600px;font-size:21px;line-height:1.4;color:#8a8e99}
</style></head><body>
<i class="g g1"></i><i class="g g2"></i><i class="g g3"></i>
<div class="top"><div class="pill glass"><b>●</b>&nbsp; UI / UX · Front-end</div><div class="pill glass">Concept 2026</div></div>
<h1>Редизайн<br>магазина <span>в&nbsp;стиле<br>Liquid Glass</span></h1>
<div class="desk glass"><img src="desk.png"></div>
<div class="cart glass"><img src="cart.png"></div>
<div class="phone"><img src="mob.png"></div>
<div class="chips">
<div class="chip glass"><i>1200+</i> товаров</div>
<div class="chip glass">Каталог</div>
<div class="chip glass">Корзина</div>
<div class="chip glass">Поиск</div>
</div>
<div class="note">Учебный концепт для портфолио.<br>Не официальный сайт магазина.</div>
<div class="foot"><div>@your_handle</div><div class="tech"><span>HTML</span><span>CSS</span><span>JS</span></div></div>
</body></html>
