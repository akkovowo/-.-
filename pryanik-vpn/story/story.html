<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Story — PRYANIK NET redesign</title>
<link rel="stylesheet" href="../style.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.story{position:relative;width:1080px;height:1920px;overflow:hidden}
.story::before{content:"";position:absolute;inset:-60px;background:url(../assets/bg.webp) center/cover;opacity:.5;filter:contrast(1.03) brightness(.5) grayscale(.6)}
.story::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 40% at 50% 0%,rgba(251,113,133,.16),transparent 70%),linear-gradient(180deg,transparent 60%,rgba(0,0,0,.45))}
.in{position:absolute;inset:0;z-index:1;padding:200px 72px 0}
.tag{display:inline-flex;align-items:center;gap:12px;font-family:var(--font-mono);font-weight:700;font-size:26px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.tag i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
h1{margin:26px 0 0;font-family:var(--font-display);font-weight:650;font-size:92px;line-height:.94;letter-spacing:-.055em}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin-top:20px;font-size:30px;line-height:1.35;color:var(--muted);max-width:760px}
.mock{position:absolute;left:0;right:0;top:540px;height:900px}
.win{position:absolute;left:72px;top:0;width:936px;border-radius:26px;padding:0}
.win .top{display:flex;gap:9px;padding:15px 20px;border-bottom:1px solid rgba(255,255,255,.09)}
.win .top i{width:14px;height:14px;border-radius:50%;background:#ff5f57}.win .top i:nth-child(2){background:#febc2e}.win .top i:nth-child(3){background:#28c840}
.win img{display:block;width:100%}
.phone{position:absolute;padding:10px;border-radius:52px;background:#0b0a0c;border:3px solid #3a3639;box-shadow:0 0 0 2px #17151a,inset 0 0 0 2px #232025,0 50px 100px rgba(0,0,0,.6),0 12px 30px rgba(0,0,0,.4)}
.phone::before,.phone::after{content:"";position:absolute;width:5px;background:#3a3639;border-radius:3px}
.phone::before{left:-8px;top:150px;height:70px;box-shadow:0 100px 0 #3a3639}
.phone::after{right:-8px;top:210px;height:110px}
.phone .isl{position:absolute;left:50%;top:21px;width:84px;height:25px;margin-left:-42px;border-radius:20px;background:#000;z-index:2}
.phone .glare{position:absolute;inset:10px;border-radius:42px;background:linear-gradient(115deg,rgba(255,255,255,.10),transparent 32%);pointer-events:none;z-index:3}
.p-mid{left:50%;margin-left:-185px;top:0;width:370px;z-index:2}.p-side{width:255px;z-index:2}
.scr{position:relative;overflow:hidden;border-radius:42px;background:#190507;aspect-ratio:390/844}
.scr img{display:block;width:100%;margin-top:44px}
.scr .sb{position:absolute;left:34px;right:30px;top:20px;display:flex;justify-content:space-between;font:600 15px/1 -apple-system,system-ui,sans-serif;color:#fff;z-index:1}
.scr .sb i{display:inline-block;width:24px;height:11px;border:1.5px solid rgba(255,255,255,.7);border-radius:4px;position:relative}
.scr .sb i::after{content:"";position:absolute;inset:1.5px;right:5px;background:#fff;border-radius:1.5px}
.foot{position:absolute;left:72px;right:72px;bottom:240px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.chips{display:flex;flex-wrap:wrap;gap:12px;max-width:640px}
.chip{padding:12px 22px;border-radius:999px;font-size:25px;font-weight:600;color:var(--muted);border:1px solid var(--lg-line-soft);background:rgba(255,255,255,.06);backdrop-filter:blur(12px)}
.me{text-align:right;font-family:var(--font-mono)}
.me b{display:block;font-size:44px;font-weight:900;color:var(--accent);line-height:1}
.me span{display:block;margin-top:10px;font-size:24px;color:var(--muted)}
</style></head><body>
<div class="story"><div class="in">
  <div class="tag"><i></i>Portfolio · Redesign</div>
  <h1>PRYANIK<br><em>NET</em> VPN</h1>
  <p class="sub">Лендинг в стиле личного кабинета: стекло, анимации, адаптив.</p>
  <div class="mock">
    <div class="card win"><div class="top"><i></i><i></i><i></i></div><img src="shot-pc.png" alt=""></div>
    <div class="phone p-side" style="left:40px;top:430px"><span class="isl"></span><div class="scr"><div class="sb"><span>9:41</span><i></i></div><img src="shot-m2.png" alt=""></div><span class="glare"></span></div>
    <div class="phone p-side" style="right:40px;top:430px"><span class="isl"></span><div class="scr"><div class="sb"><span>9:41</span><i></i></div><img src="shot-m3.png" alt=""></div><span class="glare"></span></div>
  </div>
  <div class="foot">
    <div class="chips"><span class="chip">HTML</span><span class="chip">CSS</span><span class="chip">Анимации</span></div>
    <div class="me"><b>estk</b><span>t.me/riskybenefit</span></div>
  </div>
</div></div>
</body></html>
